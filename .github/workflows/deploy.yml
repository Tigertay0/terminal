# Checks every pull request, and deploys master to the Cloudflare Worker
# (terminal.tiger-tayo.workers.dev) once the same checks pass.
#
# Needs one repository secret, CLOUDFLARE_API_TOKEN: an API token made from the
# "Edit Cloudflare Workers" template. The account comes from wrangler.jsonc.
# The Worker's own secrets (BETTER_AUTH_SECRET, ANTHROPIC_API_KEY, ...) stay on
# Cloudflare and are kept by every deploy.
name: Check and deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The database tests skip themselves without .secrets/, so this runs the API tests only.
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
